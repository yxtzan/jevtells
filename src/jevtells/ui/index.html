<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JevTells</title><link rel="stylesheet" href="/static/style.css"><script src="/static/app.js" defer></script></head>
<body>
<aside><a class="brand" href="/">Jev<span>Tells</span><small data-i18n="brandSub"></small></a><div class="rail-label" data-i18n="workspace"></div><nav id="steps"></nav><div class="rail-bottom"><button id="historyNav" data-i18n="history"></button><button id="settingsNav" data-i18n="settings"></button><div class="local"><i></i><span data-i18n="localOnly"></span></div></div></aside>
<main><header><span id="breadcrumb"></span><div><span class="pill" data-i18n="offline"></span><button id="language">EN</button></div></header><div id="blockers" hidden></div><div id="notice" role="status" hidden></div>
<section class="page" id="page1"><div class="eyebrow" data-i18n="step1"></div><h1 data-i18n="sourceTitle"></h1><p class="intro" data-i18n="sourceIntro"></p><div class="source-grid"><div><label class="drop" id="drop"><span class="upload-icon">↥</span><strong data-i18n="dropTitle"></strong><span data-i18n="dropHint"></span><input id="upload" type="file" accept="video/*" hidden><span class="button" data-i18n="browse"></span></label><div class="or" data-i18n="orExisting"></div><label class="field"><span data-i18n="samples"></span><select id="samples"><option value=""></option></select></label><div id="mediaMeta" class="meta"></div></div><div class="preview-card"><video id="sourceVideo" controls playsinline></video><div class="preview-caption"><span data-i18n="sourcePreview"></span><span>01 / 05</span></div></div></div><div class="card range-card"><div><h3 data-i18n="analysisRange"></h3><p data-i18n="fullDefault"></p></div><label class="check"><input type="checkbox" id="autoStart"><span data-i18n="autoStart"></span></label><div class="range-fields"><label><span data-i18n="start"></span><input type="range" id="rangeStart" min="0" max="1" step="0.0333333" value="0"><output id="startValue">0.00s</output></label><label><span data-i18n="end"></span><input type="range" id="rangeEnd" min="0" max="1" step="0.0333333" value="1"><output id="endValue">—</output></label></div></div></section>
<section class="page" id="page2" hidden><div class="eyebrow" data-i18n="step2"></div><h1 data-i18n="personTitle"></h1><p class="intro" data-i18n="personIntro"></p><div class="edit-grid"><div><div class="frame" id="personFrame"><img id="personImage" alt=""><svg id="personBoxes" viewBox="0 0 1280 720"></svg></div><div class="scrubber"><input type="range" id="personTime" min="0" max="1" step="0.0333333" value="0"><output id="personTimeValue">0.00s</output></div><button id="detect" class="secondary" data-i18n="detect"></button></div><div class="card"><label class="field"><span data-i18n="speaker"></span><input id="speaker" placeholder="Tim"></label><h3 data-i18n="anchors"></h3><p data-i18n="anchorsHint"></p><div id="anchors"></div><label class="check"><input type="checkbox" id="faceIdentity" checked><span data-i18n="faceIdentity"></span></label><details><summary data-i18n="experimental"></summary><label class="field"><span data-i18n="description"></span><input id="targetDesc"></label><p data-i18n="descriptionHint"></p></details></div></div></section>
<section class="page" id="page3" hidden><div class="eyebrow" data-i18n="step3"></div><h1 data-i18n="lookTitle"></h1><p class="intro" data-i18n="lookIntro"></p><div class="edit-grid"><div><div class="frame" id="blurFrame"><img id="blurImage" alt=""><div id="blurBoxes"></div></div><div class="scrubber"><input type="range" id="blurTime" min="0" max="1" step="0.0333333" value="0"><output id="blurTimeValue">0.00s</output></div><div id="blurList" class="chips"></div></div><div class="card"><label class="field"><span data-i18n="title"></span><input id="title"></label><label class="check"><input type="checkbox" id="burned"><span data-i18n="burned"></span></label><p data-i18n="burnedHint"></p><div class="frame subtitle-frame"><img id="subtitleImage" alt=""><div id="subtitleBand"></div></div><p id="subtitleStatus"></p><label class="field"><span data-i18n="subtitleSource"></span><select id="subtitleSource"><option value="auto" data-i18n="automatic"></option><option value="ocr" data-i18n="ocr"></option><option value="asr" data-i18n="asr"></option></select></label></div></div></section>
<section class="page" id="page4" hidden><div class="eyebrow" data-i18n="step4"></div><h1 data-i18n="talkTitle"></h1><p class="intro" data-i18n="talkIntro"></p><div class="talk-top"><video id="timelineVideo" controls playsinline></video><div class="card"><span class="pill lime" data-i18n="localProcessing"></span><h2 data-i18n="prepareTitle"></h2><p data-i18n="prepareHint"></p><button id="prepare" class="primary" data-i18n="prepare"></button><div class="legend"><span class="dot lime-bg"></span><span data-i18n="targetTalk"></span><span class="dot other-bg"></span><span data-i18n="otherTalk"></span><span class="hatch-key"></span><span data-i18n="absent"></span></div></div></div><div class="card timeline-card"><div class="timeline-heading"><h3 data-i18n="timeline"></h3><output id="timelineTime">0.00s</output></div><div class="timeline-scroll"><div id="timeline"><div id="ticks"></div><div id="thumbs"></div><div id="absence"></div><div id="shotLines"></div><div id="cues"></div><div id="others"></div><div id="playhead"></div></div></div><p data-i18n="timelineHint"></p><div id="intervalList" class="chips"></div></div></section>
<section class="page" id="page5" hidden><div class="eyebrow" data-i18n="step5"></div><h1 data-i18n="generateTitle"></h1><p class="intro" data-i18n="generateIntro"></p><div class="generate-grid"><div class="card"><h3 data-i18n="summary"></h3><dl id="summary"></dl><details><summary data-i18n="equivalent"></summary><pre id="command"></pre><button id="copy" data-i18n="copy"></button></details></div><div class="card generate-cta"><span class="big-mark">↗</span><h2 data-i18n="ready"></h2><p data-i18n="cacheHint"></p><button id="generate" class="primary" data-i18n="generate"></button><span class="small" data-i18n="costHint"></span></div></div><div id="results" hidden><div class="results-heading"><h2 data-i18n="finished"></h2><button id="reveal" data-i18n="reveal"></button></div><div class="output-grid"><div><video id="outputH" controls></video><a id="downloadH" class="button" data-i18n="downloadH"></a></div><div><video id="outputV" controls></video><a id="downloadV" class="button" data-i18n="downloadV"></a></div></div></div></section>
<section class="page" id="pageSettings" hidden><div class="eyebrow" data-i18n="preferences"></div><h1 data-i18n="settings"></h1><p class="intro" data-i18n="settingsIntro"></p><div class="generate-grid"><div class="card"><h3 data-i18n="doctor"></h3><div id="checks"></div></div><div class="card"><label class="field"><span data-i18n="key"></span><span id="keyStatus" class="pill"></span><input id="key" type="password" autocomplete="new-password" spellcheck="false"></label><p data-i18n="keyHint"></p><label class="field"><span data-i18n="defaultLanguage"></span><select id="defaultLanguage"><option value="zh">中文</option><option value="en">English</option></select></label><label class="field"><span data-i18n="outputDir"></span><input id="outputDir" value="work"></label><button id="saveSettings" class="primary" data-i18n="save"></button></div></div></section>
<section class="page" id="pageHistory" hidden><div class="eyebrow" data-i18n="library"></div><h1 data-i18n="history"></h1><p class="intro" data-i18n="historyIntro"></p><div id="historyList"></div></section>
<div id="jobPanel" class="card" hidden><div class="job-heading"><h3 id="jobStatus"></h3><span id="jobCost"></span><button id="cancel" data-i18n="cancel"></button></div><progress id="progress" max="100" value="0"></progress><div id="stageList"></div><details><summary data-i18n="logs"></summary><pre id="logs"></pre></details></div>
<footer id="wizardFooter"><span id="footerHint"></span><div><button id="back" data-i18n="back"></button><button id="next" class="primary" data-i18n="next"></button></div></footer><div class="disclaimer" data-i18n="disclaimer"></div></main></body></html>
