# Video and window defaults
max_fps: 30
max_width: 1920
min_window: 2.0
max_window: 5.0

video:
  max_fps: 30
  max_width: 1920

models:
  whisper: small
  pose: pose_landmarker_full.task
  hands: hand_landmarker.task

jev:
  model: typesafe/jev-1.13

scene:
  auto: true
  model: google/gemini-3.1-flash-lite

narrate:
  model: google/gemini-3.1-flash-lite
  max_tokens: 120
  validation_retries: 2
  facts:
    delta_threshold: 0.08
    trend_deltas: 2
    epsilon: 0.000000001
    min_extrema_windows: 2

detection:
  max_people: 4
  max_hands: 4
  pose_visibility_threshold: 0.5
  hand_match_max_shoulder_width: 0.75

tracking:
  iou_threshold: 0.20
  max_center_distance_shoulder_width: 2.0
  area_ratio_min: 0.50
  area_ratio_max: 2.00
  appearance_similarity: 0.70
  appearance_size_ratio_min: 0.50
  appearance_size_ratio_max: 2.00

windows:
  min_seconds: 2.0
  max_seconds: 5.0

voice:
  sample_rate: 16000
  hop_seconds: 0.05
  f0_min_hz: 65.0
  f0_max_hz: 500.0
  frame_length: 2048
  pitch_low_semitones: 1.5
  pitch_high_semitones: 4.0
  pauses_few_max_ratio: 0.20
  pauses_many_min_ratio: 0.50

smoothing:
  enabled: true
  window_length: 7
  polyorder: 2
  max_gap_frames: 5

actions:
  pose_visibility_threshold: 0.5
  motion_visibility_threshold: 0.75
  edge_margin: 0.04
  hand_detection_ratio: 0.80
  occupied_window_seconds: 10.0
  occupied_face_radius: 1.0
  occupied_ratio: 0.60
  occupied_event_ratio: 0.50
  posture_window: 5.0
  posture_ratio: 0.70
  min_action_duration: 0.20
  movement_threshold: 0.12
  state_threshold: 0.65
  fist_max_openness: 0.20
  fist_max_tip_palm_ratio: 1.00
  point_frame_ratio: 0.80
  max_per_window: 4
  merge_gap: 0.20
  small_threshold: 0.15
  large_threshold: 0.35
  palms_up_min_score: 0.50
  palms_up_max_vertical_cos: 0.70710678
  palms_up_min_nose_offset: 0.30
  hand_point_frame_ratio: 1.0

# Motion below this magnitude remains in actions.json but is omitted from
# the measured_actions text sent to Jev.
state_min_motion_magnitude: medium

lean_in:
  enabled: false

shots:
  histogram_threshold: 0.45
  histogram_grid: 2
  subtitle_exclusion_ratio: 0.20
  min_seconds: 0.50
  target_padding_shoulder: 0.15
  far_shoulder_ratio: 0.15
  target_presence_ratio: 0.50
  min_target_height_ratio: 0.25

colour:
  target: '#00E5FF'
  other: '#A0A7B4'
  text: '#FFFFFF'
  background: '#121212'

# US spelling is kept as an alias for callers that use colour/colour settings.
colors:
  target: '#00E5FF'
  other: '#A0A7B4'
  text: '#FFFFFF'
  background: '#121212'

other_speaker_overlap: 0.5
stop_on_api_error: true

# Dimensions are CSS/design pixels. Layout.scale multiplies every dimension.
