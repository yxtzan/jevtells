[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "jevtells"
version = "0.7.0"
requires-python = ">=3.11"
dependencies = ["numpy<2", "opencv-python==4.11.0.86", "opencv-contrib-python==4.11.0.86", "mediapipe", "pydantic", "pyyaml", "librosa", "scipy", "faster-whisper", "Pillow", "python-dotenv", "rapidocr-onnxruntime==1.4.4", "Flask==3.1.2"]
[project.scripts]
jevtells = "jevtells.cli:main"
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jevtells = ["data/config/*.yaml", "data/config/*.md", "data/i18n/*.yaml", "ui/*.html", "ui/*.css", "ui/*.js", "ui/locales/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
