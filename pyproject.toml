[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "jevtells"
version = "0.5.0"
requires-python = ">=3.11"
dependencies = ["numpy", "opencv-contrib-python", "mediapipe", "pydantic", "pyyaml", "librosa", "scipy", "faster-whisper", "Pillow", "python-dotenv"]
[project.scripts]
jevtells = "jevtells.cli:main"
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jevtells = ["data/config/*.yaml", "data/config/*.md", "data/i18n/*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
